<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Lingual Vocabulary Coach - Grade 10</title>
    <!-- Tailwind CSS for rapid responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Application Styles -->
    <link rel="stylesheet" href="script.css">
</head>
<body class="py-10 px-4">

    <div class="cv-container w-full max-w-3xl shadow-xl rounded-2xl p-6 md:p-8">
        <!-- Theme switcher target container for restrictions.js toolbar injection -->
        <div class="theme-switcher"></div>

        <header class="text-center mb-6">
            <div class="flex justify-center items-center gap-3 mb-2">
                <img src="" alt="Profile" class="profile-img hidden">
                <h1 class="text-2xl font-bold">Multi-Lingual Vocabulary Coach</h1>
            </div>
            <p class="text-sm opacity-80">Master new words daily tailored to your exact proficiency level and chosen language</p>
        </header>

        <!-- Onboarding Form -->
        <div id="onboarding-form" class="space-y-4 border p-6 rounded-xl">
            <h3 class="font-semibold text-lg mb-2">Session Configuration</h3>
            
            <div>
                <label class="block text-sm font-medium mb-1">1. Which language would you like to learn words in today?</label>
                <select id="lang-select" class="w-full p-3 border rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="" disabled selected>Select an option</option>
                    <option value="English">English</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Spanish">Spanish</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Punjabi">Punjabi</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">2. What is your proficiency or difficulty level?</label>
                <select id="level-select" class="w-full p-3 border rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="" disabled selected>Select an option</option>
                    <option value="Beginner">Beginner (Just started learning)</option>
                    <option value="Intermediate">Intermediate (~30-40% vocabulary knowledge)</option>
                    <option value="Advanced">Advanced (High proficiency)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">3. How many total new words would you like to learn today? (Enter any custom number)</label>
                <input type="number" id="word-count" min="1" placeholder="Enter any number (e.g., 3, 6, 9)" class="w-full p-3 border rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">4. Which category or theme of words would you like to focus on?</label>
                <input type="text" id="theme-input" placeholder="e.g., Daily conversational, Professional, Travel" class="w-full p-3 border rounded-lg bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="startLearning()" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Generate Vocabulary</button>
        </div>

        <!-- Learning Dashboard (Hidden Initially) -->
        <div id="dashboard-container" class="hidden space-y-6">
            <div class="flex justify-between items-center p-4 rounded-xl text-sm font-medium border">
                <span id="summary-info"></span>
                <button onclick="resetApp()" class="text-xs border px-3 py-1.5 rounded-lg hover:opacity-80 font-medium">Change Settings</button>
            </div>

            <!-- Session Tabs -->
            <div class="flex border-b space-x-4">
                <button onclick="switchSession('morning')" id="tab-morning" class="pb-2 font-semibold border-b-2 border-indigo-600">Morning Session</button>
                <button onclick="switchSession('afternoon')" id="tab-afternoon" class="pb-2 font-semibold opacity-60">Afternoon Session</button>
                <button onclick="switchSession('evening')" id="tab-evening" class="pb-2 font-semibold opacity-60">Evening Session</button>
            </div>

            <!-- Session Content -->
            <div id="session-content" class="space-y-6"></div>
        </div>
    </div>

    <!-- Configuration & Scripts -->
    <script src="master-config.js"></script>
    <script src="restrictions.js"></script>

                ],
                Advanced: [
                    { word: "ਪਰਉਪਕਾਰੀ", phonetic: "/parupkari/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Benevolent / Charitable", example: "ਉਹ ਇੱਕ ਪਰਉਪਕਾਰੀ ਇਨਸਾਨ ਹੈ।", synonyms: [{ word: "ਦਿਆਲੂ", phonetic: "/dialu/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Kind", example: "ਦਿਆਲੂ ਸੁਭਾਅ।" }] },
                    { word: "ਦ੍ਰਿੜ੍ਹ", phonetic: "/dridh/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Resilient / Resolute", example: "ਆਪਣੇ ਟੀਚੇ ਪ੍ਰਤੀ ਦ੍ਰਿੜ੍ਹ ਰਹੋ।", synonyms: [{ word: "ਮਜ਼ਬੂਤ", phonetic: "/mazbut/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Strong", example: "ਮਜ਼ਬੂਤ ਇਰਾਦਾ।" }] },
                    { word: "ਬਾਰੀਕ", phonetic: "/barik/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Meticulous / Detailed", example: "ਹਰ ਗੱਲ ਦੀ ਬਾਰੀਕੀ ਨਾਲ ਜਾਂਚ ਕਰੋ।", synonyms: [{ word: "ਸੁਚੇਤ", phonetic: "/suchet/", pos: "Adjective (ਵਿਸ਼ేਸ਼ਣ)", meaning: "Alert", example: "ਸੁਚੇਤ ਰਵੱਈਆ।" }] }
                ]
            }
        };

        let vocabularyData = {};

        function startLearning() {
            const lang = document.getElementById("lang-select").value;
            const level = document.getElementById("level-select").value;
            const countInput = document.getElementById("word-count").value;
            const theme = document.getElementById("theme-input").value || "General Vocabulary";

            if (!lang) { alert("Please select a Language."); return; }
            if (!level) { alert("Please select a Difficulty Level."); return; }
            const count = parseInt(countInput);
            if (isNaN(count) || count < 1) { alert("Please enter a valid total word count (minimum 1)."); return; }

            document.getElementById("onboarding-form").classList.add("hidden");
            document.getElementById("dashboard-container").classList.remove("hidden");
            document.getElementById("summary-info").innerText = `Language: ${lang} | Level: ${level} | Theme: ${theme}`;

            // Dynamically select vocabulary pool based on user's chosen language and level
            const langBank = vocabularyBank[lang] || vocabularyBank["English"];
            let pool = [...(langBank[level] || langBank["Intermediate"] || Object.values(langBank)[0])];
            
            let selectedWords = [];
            while (selectedWords.length < count) {
                let shuffled = [...pool].sort(() => Math.random() - 0.5);
                selectedWords = selectedWords.concat(shuffled);
            }
            selectedWords = selectedWords.slice(0, count);

            const base = Math.floor(count / 3);
            const rem = count % 3;
            const morningCount = base + (rem > 0 ? 1 : 0);
            const afternoonCount = base + (rem > 1 ? 1 : 0);
            const eveningCount = base;

            let mEnd = morningCount;
            let aEnd = mEnd + afternoonCount;

            vocabularyData = {
                morning: selectedWords.slice(0, mEnd),
                afternoon: selectedWords.slice(mEnd, aEnd),
                evening: selectedWords.slice(aEnd)
            };

            switchSession('morning');
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech not supported in this browser.");
            }
        }

        function switchSession(sessionName) {
            ['morning', 'afternoon', 'evening'].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                if (s === sessionName) {
                    btn.className = "pb-2 font-semibold border-b-2 border-indigo-600";
                } else {
                    btn.className = "pb-2 font-semibold opacity-60 hover:opacity-100";
                }
            });

            const content = document.getElementById("session-content");
            content.innerHTML = "";

            const wordsList = vocabularyData[sessionName] || [];
            if (wordsList.length === 0) {
                content.innerHTML = `<p class="opacity-60 text-center py-6">No words assigned for this session.</p>`;
                return;
            }

            wordsList.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "border rounded-xl p-5 space-y-4 shadow-sm vocab-content";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-xl font-bold flex items-center gap-2">
                                ${item.word} 
                                <button onclick="speakText('${item.word}')" class="text-indigo-600 hover:text-indigo-800 text-lg cursor-pointer" title="Listen">🔊</button>
                            </h2>
                            <p class="text-xs opacity-70 mt-0.5"><strong>Pronunciation / Phonetic Guide:</strong> ${item.phonetic}</p>
                        </div>
                        <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">${item.pos}</span>
                    </div>
                    
                    <div class="text-sm space-y-1.5 pt-1">
                        <p><strong>Meaning:</strong> ${item.meaning}</p>
                        <p class="italic opacity-80"><strong>Example Sentence:</strong> ${item.example}</p>
                    </div>

                    <div class="border-t pt-3 space-y-3">
                        <h4 class="text-xs font-bold uppercase tracking-wider opacity-70">Synonyms & Details:</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${item.synonyms.map((syn, sIdx) => `
                                <div class="p-3.5 rounded-lg border text-xs space-y-1.5 shadow-xs">
                                    <div class="font-semibold flex items-center justify-between">
                                        <span>${sIdx + 1}.${syn.word}</span>
                                        <button onclick="speakText('${syn.word}')" class="text-indigo-600 hover:text-indigo-800 cursor-pointer" title="Listen">🔊</button>
                                    </div>
                                    <div><strong>Phonetic:</strong> ${syn.phonetic}</div>
                                    <div><strong>Part of Speech:</strong> ${syn.pos}</div>
                                    <div><strong>Meaning:</strong> ${syn.meaning}</div>
                                    <div class="italic opacity-80"><strong>Example:</strong> ${syn.example}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function resetApp() {
            document.getElementById("dashboard-container").classList.add("hidden");
            document.getElementById("onboarding-form").classList.remove("hidden");
            document.getElementById("lang-select").selectedIndex = 0;
            document.getElementById("level-select").selectedIndex = 0;
            document.getElementById("word-count").value = "";
            document.getElementById("theme-input").value = "";
        }
    </script>
</body>
</html>
