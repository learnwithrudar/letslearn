<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Lingual Vocabulary Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl p-6 md:p-8">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">Multi-Lingual Vocabulary Coach</h1>
            <p class="text-sm text-slate-500">Master new words daily across morning, afternoon, and evening sessions</p>
        </header>

        <!-- Onboarding Form (All on One Page, No Defaults) -->
        <div id="onboarding-form" class="space-y-4 bg-indigo-50/40 border border-indigo-100 p-6 rounded-xl">
            <h3 class="font-semibold text-lg text-indigo-900 mb-2">Session Configuration</h3>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">1. Which language would you like to learn words in today?</label>
                <select id="lang-select" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="" disabled selected>Select an option</option>
                    <option value="English">English</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Spanish">Spanish</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Punjabi">Punjabi</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">2. What is your proficiency or difficulty level?</label>
                <select id="level-select" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="" disabled selected>Select an option</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">3. How many total new parent words would you like to learn today? (Splits into Morning, Afternoon, Evening)</label>
                <input type="number" id="word-count" min="3" max="15" value="6" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">4. Which category or theme of words would you like to focus on?</label>
                <input type="text" id="theme-input" placeholder="e.g., Daily conversational, Professional, Travel" class="w-full p-3 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="startLearning()" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition shadow-md">Generate Vocabulary</button>
        </div>

        <!-- Learning Dashboard (Hidden Initially) -->
        <div id="dashboard-container" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-100 p-4 rounded-xl text-sm font-medium">
                <span id="summary-info" class="text-indigo-700"></span>
                <button onclick="resetApp()" class="text-xs bg-white border border-slate-300 px-3 py-1.5 rounded-lg hover:bg-slate-50 font-medium">Change Settings</button>
            </div>

            <!-- Session Tabs -->
            <div class="flex border-b border-slate-200 space-x-4">
                <button onclick="switchSession('morning')" id="tab-morning" class="pb-2 font-semibold text-indigo-600 border-b-2 border-indigo-600">Morning Session</button>
                <button onclick="switchSession('afternoon')" id="tab-afternoon" class="pb-2 font-semibold text-slate-400 hover:text-slate-600">Afternoon Session</button>
                <button onclick="switchSession('evening')" id="tab-evening" class="pb-2 font-semibold text-slate-400 hover:text-slate-600">Evening Session</button>
            </div>

            <!-- Session Content -->
            <div id="session-content" class="space-y-6"></div>
        </div>
    </div>

    <script>
        // Rich vocabulary repository mirroring your desired structure
        const vocabularyBank = {
            English: [
                {
                    word: "Joy", phonetic: "/dʒɔɪ/ (जॉय)", pos: "Noun (संज्ञा)",
                    meaning: "A feeling of great happiness | बहुत खुशी या आनंद का अहसास",
                    example: "Playing with children brings great joy. | बच्चों के साथ खेलने से बहुत खुशी मिलती है।",
                    synonyms: [
                        { word: "Happiness", phonetic: "/ˈhæp.i.nəs/ (हैप्पीनेस)", pos: "Noun (संज्ञा)", meaning: "The state of being happy | प्रसन्नता या सुख", example: "Her smile was full of happiness. | उसकी मुस्कान खुशी से भरी थी।" },
                        { word: "Delight", phonetic: "/dɪˈlaɪt/ (डिलाइट)", pos: "Noun (संज्ञा)", meaning: "High degree of pleasure or enjoyment | अत्यधिक आनंद", example: "The magic show was a pure delight. | जादू का शो शुद्ध आनंद था।" }
                    ]
                },
                {
                    word: "Courage", phonetic: "/ˈkʌr.ɪdʒ/ (करेज)", pos: "Noun (संज्ञा)",
                    meaning: "The ability to do something that frightens one; bravery | साहस या हिम्मत",
                    example: "It takes courage to speak the truth. | सच बोलने के लिए साहस की जरूरत होती है।",
                    synonyms: [
                        { word: "Bravery", phonetic: "/ˈbreɪ.vər.i/ (ब्रेवरी)", pos: "Noun (संज्ञा)", meaning: "Courageous behavior or character | बहादुरी", example: "The soldier showed great bravery in battle. | सैनिक ने युद्ध में महान बहादुरी दिखाई।" },
                        { word: "Valor", phonetic: "/ˈvæl.ər/ (वैलर)", pos: "Noun (संज्ञा)", meaning: "Great courage in the face of danger | वीरता", example: "He was awarded a medal for his valor. | उन्हें उनकी वीरता के लिए पदक से सम्मानित किया गया।" }
                    ]
                },
                {
                    word: "Diligent", phonetic: "/ˈdɪl.ɪ.dʒənt/ (डिलिजेंट)", pos: "Adjective (विशेषण)",
                    meaning: "Having or showing care and conscientiousness in work | मेहनती या परिश्रमी",
                    example: "She is a diligent student who completes her homework. | वह एक मेहनती छात्रा है जो अपना गृहकार्य पूरा करती है।",
                    synonyms: [
                        { word: "Hardworking", phonetic: "/ˈhɑːrdˌwɜːr.kɪŋ/ (हार्डवर्किंग)", pos: "Adjective (विशेषण)", meaning: "Tending to work with energy | मेहनती", example: "He is a hardworking employee. | वह एक मेहनती कर्मचारी है।" },
                        { word: "Industrious", phonetic: "/ɪnˈdʌs.tri.əs/ (इंडस्ट्रियस)", pos: "Adjective (विशेषण)", meaning: "Diligent and hard-working | उद्यमी / कर्मठ", example: "An industrious person achieves success quickly. | एक कर्मठ व्यक्ति जल्दी सफलता प्राप्त करता है।" }
                    ]
                },
                {
                    word: "Eloquent", phonetic: "/ˈel.ə.kwənt/ (एलोक्वेंट)", pos: "Adjective (विशेषण)",
                    meaning: "Fluent or persuasive in speaking or writing | सुवक्ता या स्पष्टवादी",
                    example: "Her eloquent speech touched everyone's heart. | उनके ओजस्वी भाषण ने सभी का दिल जीत लिया।",
                    synonyms: [
                        { word: "Articulate", phonetic: "/ɑːrˈtɪk.ju.lət/ (आर्टिकुलेट)", pos: "Adjective (विशेषण)", meaning: "Able to speak fluently and coherently | स्पष्ट बोलने वाला", example: "He is very articulate during meetings. | वह बैठकों के दौरान बहुत स्पष्ट बोलते हैं।" },
                        { word: "Expressive", phonetic: "/ɪkˈspres.ɪv/ (एक्सप्रेसिव)", pos: "Adjective (विशेषण)", meaning: "Effectively conveying thought or feeling | भावपूर्ण", example: "Her eyes were deeply expressive. | उनकी आँखें अत्यधिक भावपूर्ण थीं।" }
                    ]
                },
                {
                    word: "Resilient", phonetic: "/rɪˈzɪl.jənt/ (रेजिलिएंट)", pos: "Adjective (विशेषण)",
                    meaning: "Able to withstand or recover quickly from difficult conditions | लचीला",
                    example: "Small businesses need to be resilient to survive. | छोटे व्यवसायों को जीवित रहने के लिए लचीला होना चाहिए।",
                    synonyms: [
                        { word: "Tough", phonetic: "/tʌf/ (टफ)", pos: "Adjective (विशेषण)", meaning: "Strong enough to withstand adverse conditions | मजबूत", example: "We need to stay tough during hard times. | हमें कठिन समय में मजबूत रहना होगा।" },
                        { word: "Adaptable", phonetic: "/əˈdæp.tə.bəl/ (अडैप्टेबल)", pos: "Adjective (विशेषण)", meaning: "Able to adjust to new conditions | अनुकूलनीय", example: "An adaptable worker succeeds anywhere. | एक अनुकूलनीय कर्मचारी कहीं भी सफल होता है।" }
                    ]
                },
                {
                    word: "Benevolent", phonetic: "/bəˈnev.ə.lənt/ (बिनेवोलेंट)", pos: "Adjective (विशेषण)",
                    meaning: "Well meaning and kindly | परोपकारी या दयालु",
                    example: "The benevolent donor funded the entire project. | परोपकारी दाता ने पूरी परियोजना को वित्त पोषित किया।",
                    synonyms: [
                        { word: "Kind", phonetic: "/kaɪnd/ (काइइंड)", pos: "Adjective (विशेषण)", meaning: "Having a friendly and generous nature | दयालु", example: "She is a very kind neighbor. | वह बहुत दयालु पड़ोसी हैं।" },
                        { word: "Generous", phonetic: "/ˈdʒen.ər.əs/ (जेनरस)", pos: "Adjective (विशेषण)", meaning: "Showing readiness to give more than expected | उदार", example: "He made a generous donation. | उन्होंने एक उदार दान दिया।" }
                    ]
                }
            ]
        };

        let vocabularyData = {};

        function startLearning() {
            const lang = document.getElementById("lang-select").value;
            const level = document.getElementById("level-select").value;
            const count = parseInt(document.getElementById("word-count")).value || 6;
            const theme = document.getElementById("theme-input").value || "General Vocabulary";

            // Validate selections
            if (!lang || !level) {
                alert("Please select both a Language and a Difficulty Level before proceeding.");
                return;
            }

            document.getElementById("onboarding-form").classList.add("hidden");
            document.getElementById("dashboard-container").classList.remove("hidden");
            document.getElementById("summary-info").innerText = `Language: ${lang} | Level: ${level} | Theme: ${theme}`;

            // Fetch words (fall back to English bank if specific language array isn't fully populated yet)
            let pool = [...(vocabularyBank[lang] || vocabularyBank["English"])];
            
            // Randomize array to avoid repetitions
            pool.sort(() => Math.random() - 0.5);

            const totalWordsNeeded = Math.min(count, pool.length);
            const selectedWords = pool.slice(0, totalWordsNeeded);

            // Split into 3 equal sessions (Morning, Afternoon, Evening)
            const chunkSize = Math.ceil(selectedWords.length / 3);
            vocabularyData = {
                morning: selectedWords.slice(0, chunkSize),
                afternoon: selectedWords.slice(chunkSize, chunkSize * 2),
                evening: selectedWords.slice(chunkSize * 2)
            };

            switchSession('morning');
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech not supported in this browser.");
            }
        }

        function switchSession(sessionName) {
            ['morning', 'afternoon', 'evening'].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                if (s === sessionName) {
                    btn.className = "pb-2 font-semibold text-indigo-600 border-b-2 border-indigo-600";
                } else {
                    btn.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600";
                }
            });

            const content = document.getElementById("session-content");
            content.innerHTML = "";

            const wordsList = vocabularyData[sessionName] || [];
            if (wordsList.length === 0) {
                content.innerHTML = `<p class="text-slate-500 text-center py-6">No words assigned for this session.</p>`;
                return;
            }

            wordsList.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "border border-slate-200 rounded-xl p-5 bg-slate-50 space-y-4 shadow-sm";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-xl font-bold text-indigo-900 flex items-center gap-2">
                                ${item.word} 
                                <button onclick="speakText('${item.word}')" class="text-indigo-600 hover:text-indigo-800 text-lg cursor-pointer" title="Listen">🔊</button>
                            </h2>
                            <p class="text-xs text-slate-500 mt-0.5"><strong>Pronunciation / Phonetic Guide:</strong> ${item.phonetic}</p>
                        </div>
                        <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">${item.pos}</span>
                    </div>
                    
                    <div class="text-sm space-y-1.5 pt-1">
                        <p><strong>Meaning:</strong> ${item.meaning}</p>
                        <p class="text-slate-600 italic"><strong>Example Sentence:</strong> ${item.example}</p>
                    </div>

                    <div class="border-t border-slate-200 pt-3 space-y-3">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500">Synonyms & Details:</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${item.synonyms.map((syn, sIdx) => `
                                <div class="bg-white p-3.5 rounded-lg border border-slate-200 text-xs space-y-1.5 shadow-xs">
                                    <div class="font-semibold text-indigo-800 flex items-center justify-between">
                                        <span>${sIdx + 1}.${syn.word}</span>
                                        <button onclick="speakText('${syn.word}')" class="text-indigo-600 hover:text-indigo-800 cursor-pointer" title="Listen">🔊</button>
                                    </div>
                                    <div><strong>Phonetic:</strong> ${syn.phonetic}</div>
                                    <div><strong>Part of Speech:</strong> ${syn.pos}</div>
                                    <div><strong>Meaning:</strong> ${syn.meaning}</div>
                                    <div class="text-slate-500 italic"><strong>Example:</strong> ${syn.example}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                content.appendChild(card);
            });
        }

        function resetApp() {
            document.getElementById("dashboard-container").classList.add("hidden");
            document.getElementById("onboarding-form").classList.remove("hidden");
            document.getElementById("lang-select").selectedIndex = 0;
            document.getElementById("level-select").selectedIndex = 0;
        }
    </script>
</body>
</html>
